[package]
name = "rtcl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compatibility facade over rtcl-vm (the interpreter crate) — same paths, same features"
keywords = ["tcl", "scripting", "interpreter", "embedded"]
categories = ["parser-implementations", "embedded", "command-line-interface"]

[dependencies]
rtcl-parser.workspace = true
rtcl-vm.workspace = true

[features]
# The interpreter lives in `rtcl-vm` now; every feature is a passthrough
# so existing dependents keep their feature names. Each std-requiring
# passthrough also enables the local `std` so facade-gated re-exports
# (`channel` etc.) keep their master-era visibility.
default = ["rtcl_std"]
std = ["rtcl-vm/std"]
rtcl_std = ["rtcl-vm/rtcl_std", "std"]
file = ["rtcl-vm/file", "std"]
io = ["rtcl-vm/io", "std"]
exec = ["rtcl-vm/exec", "std"]
clock = ["rtcl-vm/clock", "std"]
regexp = ["rtcl-vm/regexp", "std"]
regexp-lite = ["rtcl-vm/regexp-lite", "std"]
env = ["rtcl-vm/env", "std"]
package = ["rtcl-vm/package", "std"]
signal = ["rtcl-vm/signal", "std"]
alloc = ["rtcl-vm/alloc"]
embedded = ["rtcl-vm/embedded"]
debug = ["rtcl-vm/debug"]

[dev-dependencies]
