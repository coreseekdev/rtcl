[package]
name = "rtcl-jit"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
rtcl-ir = { path = "../rtcl-ir" }
wasm-encoder = "0.261"

# jit-wasm: instantiation through the JS WebAssembly API (the primary
# target — wasm32-unknown-unknown in browsers / node / bun).
js-sys = { version = "0.3", optional = true }
wasm-bindgen = { version = "0.2", optional = true }

# jit-exec: in-process executor (wasmi) + the `jitsh` driver binary —
# the M1' engine for judge --engine jit and benches.  wasmi was already
# approved as the test engine (M0); promoting it to an optional real
# dependency keeps default builds untouched.
# 与 rtcl-cli 同一 feature 面（rtcl_std 默认）——judge 三向字节等价的前提。
rtcl-core = { path = "../rtcl-core", optional = true }
rtcl-parser = { path = "../rtcl-parser", optional = true }
rtcl-vm = { path = "../rtcl-vm", optional = true }
wasmi = { version = "2.0", optional = true }
wasmtime = { version = "49", optional = true }

[dev-dependencies]
rtcl-parser = { path = "../rtcl-parser" }
# Test-only engine for emitter round-trips (also the jit-exec engine).
wasmi = "2.0"

[[bin]]
name = "jitsh"
path = "src/bin/jitsh.rs"
required-features = ["jit-exec"]

[features]
default = []
jit-wasm = ["dep:js-sys", "dep:wasm-bindgen"]
# wasmtime-backed native instantiation（M1' 起接线；3.4GB ulimit 下
# -j2 构建可行，见任务回报）。需同时开 jit-exec（驱动侧共享）。
jit-native = ["jit-exec", "dep:wasmtime"]
# wasmi 执行器 + jitsh 驱动（judge --engine jit 的引擎）。
jit-exec = ["dep:wasmi", "dep:rtcl-core", "dep:rtcl-parser", "dep:rtcl-vm"]
