<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>rtcl ui::form acceptance (headless)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; min-height: 0; }
  #term { flex: 1; border-right: 1px solid #30363d; min-width: 0; overflow: auto; }
  #ui-root { flex: 1; overflow-y: auto; min-width: 0; }
  #acc { position: fixed; bottom: 0; left: 0; right: 0; max-height: 38vh; overflow: auto; background:#010409; color:#7ee787; font-size:11px; padding:6px 10px; border-top:1px solid #30363d; white-space:pre-wrap; z-index: 9; }
</style>
</head>
<body>
<main>
  <div id="term"></div>
  <div id="ui-root"></div>
</main>
<pre id="acc">booting…</pre>
<!-- 堵住 load 事件（--dump-dom --timeout 只能到点转储，页面真实任务先跑完） -->
<img src="http://127.0.0.1:8766/hang" style="display:none" alt="">
<script type="module">
import init, { RtclHandle } from '../pkg/rtcl_wasm.js';
import { createUiRuntime, registerDomRenderers, injectUiStyles } from './ui-runtime.js';
import { createShell } from './shell.js';

const acc = document.getElementById('acc');
let accLines = [];
const log = (s, mark) => { accLines.push((mark ? '  ' + mark + ' ' : '') + s); acc.textContent = accLines.join('\n'); };

const nativeRaf = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => { nativeRaf(cb); setTimeout(() => cb(0), 0); return 0; };

const shell = createShell(document.getElementById('term'), {
  exec: (s) => { if (!rtcl) throw new Error('WASM 尚未就绪'); return rtcl.exec(s); },
  isComplete: (s) => (rtcl ? rtcl.is_complete(s) : true),
});
const brace = (s) => '{' + s.replace(/\\/g, '\\\\').replace(/\{/g, '\\{').replace(/\}/g, '\\}') + '}';

let rtcl = null;

async function main() {
  await init();
  rtcl = new RtclHandle();
  rtcl.set_output_handler((s) => shell.print(s.replace(/\n$/, ''), 'puts'));
  injectUiStyles();

  const fired = [];
  const commits = [];
  const fire = (path, event, detail) => {
    fired.push([path, event, detail]);
    try {
      rtcl.dispatch_event(detail === undefined
        ? `::ui::fire ${path} ${event}`
        : `::ui::fire ${path} ${event} ${detail}`);
    } catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };
  const commitModel = (path, value) => {
    commits.push([path, value]);
    try { rtcl.dispatch_event(`ui::model set ${path} ${brace(JSON.stringify(value))}`); }
    catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };
  const runtime = createUiRuntime(document.getElementById('ui-root'), {
    fire, commitModel,
    onError: (m) => shell.print('[ui] ' + m, 'error'),
  });
  registerDomRenderers(runtime);
  rtcl.register_command('_ui', (opsJson) => { runtime.applyOps(JSON.parse(opsJson)); return ''; });

  rtcl.exec('set tcl_interactive 1');
  window.rtcl = rtcl;

  // ── 与 demo 相同：New issue 表单 ──
  rtcl.exec(`
ui::batch {
  ui::surface .n -title "New issue"
  ui::text .n.hint -variant caption -text "schema-driven form"
  ui::form .n.form -path /issue -schema {
    {"type":"object",
     "properties":{
       "title":{"type":"string","title":"Title"},
       "severity":{"enum":["low","medium","high","critical"],"title":"Severity"},
       "note":{"type":"string","title":"Note"},
       "urgent":{"type":"boolean","title":"Urgent"}},
     "required":["title","urgent"]}
  } -command {
    set vals {}
    foreach k {title severity note urgent} {
      if {![catch {ui::model get /issue/$k} v]} { lappend vals "$k=$v" }
    }
    puts "SUBMIT: [join $vals {, }]"
  }
}
# 表单初值逐字段喂：/issue 整体 set 会成标量（Tcl dict 不可再下钻，
# 字段提交会报 missing value——§8 条目 3/17）
ui::model set /issue/title "Disk full on node-7"
ui::model set /issue/urgent true
`);
  window.__acc = { runtime, fired, commits };

  acceptance(runtime, fired, commits).catch(e => log('harness error: ' + (e && e.message || e), 'ERR'));
}

async function acceptance(runtime, fired, commits) {
  await new Promise(r => setTimeout(r, 0));

  // 1) catalog 内省
  const cat = rtcl.exec('ui::catalog Form');
  const catOk = cat.includes('-path') && cat.includes('-schema') && cat.includes('-command') && cat.includes('-weight');
  log(`catalog Form introspection ${catOk ? 'OK' : 'FAIL'}`, '[1]');

  const formEl = document.querySelector('.rui-form');
  const st = formEl._form;
  const inputOf = (name) => st.inputs.get(name).input;

  // 2) 控件映射
  const labels = [...formEl.querySelectorAll('.rui-form-label')].map(l => l.textContent);
  const renderOk = st.inputs.size === 4
    && inputOf('title').type === 'text'
    && inputOf('severity').tagName === 'SELECT' && inputOf('severity').children.length === 4
    && inputOf('urgent').type === 'checkbox'
    && labels.includes('Title *') && labels.includes('Severity');
  log(`fields: ${labels.join(' | ')} ${renderOk ? 'OK' : 'FAIL'}`, '[2]');

  // 3) 模型初始值（整对象 set）灌入
  const initOk = inputOf('title').value === 'Disk full on node-7' && inputOf('urgent').checked === true;
  log(`initial model values -> inputs (title="${inputOf('title').value}", urgent=${inputOf('urgent').checked}) ${initOk ? 'OK' : 'FAIL'}`, '[3]');

  // 4) 击键不触 Tcl：input 事件零提交；change 才回写且模型可见
  const c0 = commits.length;
  inputOf('title').value = 'Disk full (edited)';
  inputOf('title').dispatchEvent(new Event('input'));
  const noKeystroke = commits.length === c0;
  inputOf('title').dispatchEvent(new Event('change'));
  await new Promise(r => setTimeout(r, 0));
  const modelSeen = rtcl.exec('ui::model get /issue/title') === 'Disk full (edited)';
  log(`keystroke silent=${noKeystroke}; change commits=${commits.length - c0} and Tcl model sees it=${modelSeen}`, '[4]');
  const disciplineOk = noKeystroke && commits.length - c0 === 1 && modelSeen;

  // 5) required 门：缺 title + urgent 未勾 → 标红 + 提示 + 零回灌
  inputOf('title').value = '';
  inputOf('title').dispatchEvent(new Event('change'));
  inputOf('urgent').checked = false;
  fired.length = 0;
  formEl.querySelector('.rui-form-submit').click();
  await new Promise(r => setTimeout(r, 0));
  const errLine = formEl.querySelector('.rui-form-error');
  const gateOk = fired.filter(f => f[1] === 'commit').length === 0
    && inputOf('title').classList.contains('rui-form-bad')
    && inputOf('urgent').classList.contains('rui-form-bad')
    && errLine.textContent === 'missing required: title, urgent';
  log(`invalid submit blocked: fires=${fired.length}, marks=${inputOf('title').classList.contains('rui-form-bad')}/${inputOf('urgent').classList.contains('rui-form-bad')}, msg="${errLine.textContent}" ${gateOk ? 'OK' : 'FAIL'}`, '[5]');

  // 6) 填齐 → commit 恰好一次、命令跑到、错误清除
  inputOf('title').value = 'Disk full (final)';
  inputOf('title').dispatchEvent(new Event('change'));
  inputOf('urgent').checked = true;
  inputOf('urgent').dispatchEvent(new Event('change'));
  inputOf('severity').value = 'high';
  inputOf('severity').dispatchEvent(new Event('change'));
  fired.length = 0;
  formEl.querySelector('.rui-form-submit').click();
  await new Promise(r => setTimeout(r, 0));
  const term = document.getElementById('term');
  const submitCount = fired.filter(f => f[1] === 'commit').length;
  const cmdRan = term.textContent.includes('SUBMIT: title=Disk full (final)') && term.textContent.includes('severity=high');
  const cleared = errLine.textContent === '' && !inputOf('title').classList.contains('rui-form-bad');
  log(`valid submit: commit×${submitCount}, command ran=${cmdRan}, errors cleared=${cleared}`, '[6]');
  const submitOk = submitCount === 1 && cmdRan && cleared;

  // 7) Enter 提交（文本输入 keydown）
  fired.length = 0;
  inputOf('note').dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
  await new Promise(r => setTimeout(r, 0));
  const enterOk = fired.filter(f => f[1] === 'commit').length === 1;
  log(`Enter in a text field submits ${enterOk ? 'OK' : 'FAIL'}`, '[7]');

  const all = catOk && renderOk && initOk && disciplineOk && gateOk && submitOk && enterOk;
  log(`VERDICT: ${all ? 'PASS' : 'FAIL'}`, 'END');
  acc.title = all ? 'acc-pass' : 'acc-fail';
}

main().catch((e) => {
  log('failed to init: ' + (e && e.message || e), 'ERR');
});
</script>
</body>
</html>
