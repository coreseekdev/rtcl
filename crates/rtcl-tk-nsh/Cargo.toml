[package]
name = "rtcl-tk-nsh"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "nsh renderer for rtcl's native Tk-compatible widget tree"

[dependencies]
rtcl-core = { workspace = true }
rtcl-tk-core = { path = "../rtcl-tk-core" }
rtcl-tk-runtime = { path = "../rtcl-tk-runtime" }
nsh-core = { version = "0.4", git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
nsh-base = { version = "0.4", default-features = false, git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
nsh-platform-linux = { version = "0.4", default-features = false }
gtk4 = { version = "0.11", features = ["v4_14"] }

# tk_messageBox/file dialogs/color picker on Windows are the very Win32
# calls Tk itself uses; feature unification keeps this one build alongside
# nsh-platform-windows' own `windows` dependency.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Memory",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
