[package]
name = "rtcl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Compatibility facade over rtcl-vm (the interpreter crate) — same paths, same features"
keywords = ["tcl", "scripting", "interpreter", "embedded"]
categories = ["parser-implementations", "embedded", "command-line-interface"]

[dependencies]
rtcl-parser.workspace = true
rtcl-vm.workspace = true
indexmap.workspace = true

num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true

[dependencies.glob]
workspace = true
optional = true

[dependencies.regex]
workspace = true
optional = true

[dependencies.regex-lite]
workspace = true
optional = true

[dependencies.spin]
workspace = true
optional = true

[features]
# The interpreter lives in `rtcl-vm` now; every feature is a passthrough
# so existing dependents keep their feature names.
default = ["rtcl_std"]
std = ["rtcl-vm/std"]
rtcl_std = ["rtcl-vm/rtcl_std"]
file = ["rtcl-vm/file"]
io = ["rtcl-vm/io"]
exec = ["rtcl-vm/exec"]
clock = ["rtcl-vm/clock"]
regexp = ["rtcl-vm/regexp"]
regexp-lite = ["rtcl-vm/regexp-lite"]
env = ["rtcl-vm/env"]
package = ["rtcl-vm/package"]
signal = ["rtcl-vm/signal"]
alloc = ["rtcl-vm/alloc"]
embedded = ["rtcl-vm/embedded"]
debug = ["rtcl-vm/debug"]

[dev-dependencies]
