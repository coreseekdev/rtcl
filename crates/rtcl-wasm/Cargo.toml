[package]
name = "rtcl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for rtcl Tcl interpreter"

[dependencies]
rtcl-core = { path = "../rtcl-core", default-features = false, features = ["std", "regexp-lite"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lib]
crate-type = ["cdylib", "rlib"]
