// ── file-io 区段：内存 fs 桥（JS 数据面契约示例；OPFS worker 形态 v2）──
// 契约见 crates/rtcl-wasm/src/fs_bridge.rs 顶部注释。
function makeMemoryFs() {
  const files = new Map();   // path -> {data, mtime}
  const dirs = new Set(['/']);
  let cwd = '/';
  const norm = (p) => {
    if (!p.startsWith('/')) p = (cwd === '/' ? '' : cwd) + '/' + p;
    const parts = [];
    for (const seg of p.split('/')) {
      if (seg === '' || seg === '.') continue;
      if (seg === '..') parts.pop(); else parts.push(seg);
    }
    return '/' + parts.join('/');
  };
  const parent = (p) => { const i = p.lastIndexOf('/'); return i <= 0 ? '/' : p.slice(0, i); };
  const base = (p) => p.slice(p.lastIndexOf('/') + 1);
  const touchDir = (p) => { let d = norm(p); while (d && d !== '/') { dirs.add(d); d = parent(d); } };
  const statFn = (p) => {
    p = norm(p);
    if (files.has(p)) {
      const f = files.get(p);
      return { size: f.data.length, mtime: f.mtime, atime: f.mtime, dir: false, file: true };
    }
    if (dirs.has(p)) {
      return { size: 0, mtime: 0, atime: 0, dir: true, file: false };
    }
    return null;
  };
  return {
    open(path, mode) {
      path = norm(path);
      const m = mode.toLowerCase();
      const exists = files.has(path);
      if (m.startsWith('r') && !m.includes('creat') && !exists) {
        throw new Error("couldn't open \"" + path + "\": no such file or directory");
      }
      if (!exists) files.set(path, { data: '', mtime: Date.now() / 1000 | 0 });
      const entry = files.get(path);
      let pos = 0;
      if (m.startsWith('a')) pos = entry.data.length;
      if (m.startsWith('w')) { entry.data = ''; entry.mtime = Date.now() / 1000 | 0; }
      const h = {
        read(n) {
          if (pos >= entry.data.length) return '';
          const s = entry.data.slice(pos, pos + (n || 1));
          pos += s.length;
          return s;
        },
        readline() {
          if (pos >= entry.data.length) return null;
          const i = entry.data.indexOf('\n', pos);
          let s;
          if (i < 0) { s = entry.data.slice(pos); pos = entry.data.length; }
          else { s = entry.data.slice(pos, i + 1); pos = i + 1; }
          return s.replace(/\r?\n$/, '');
        },
        readall() { return entry.data; },
        write(s) {
          entry.data = entry.data.slice(0, pos) + s + entry.data.slice(pos + s.length);
          pos += s.length;
          entry.mtime = Date.now() / 1000 | 0;
        },
        flush() {},
        seek(p, whence) {
          const len = entry.data.length;
          if (whence === 'set') pos = p;
          else if (whence === 'cur') pos += p;
          else pos = len + p;
          pos = Math.max(0, Math.min(pos, len));
          return pos;
        },
        tell() { return pos; },
        eof() { return pos >= entry.data.length; },
        close() {},
      };
      touchDir(parent(path));
      return h;
    },
    stat(path) { return statFn(path); },
    statfull(path, follow) {
      const s = files.has(path) || dirs.has(path) || true ? (statFn(path)) : null;
      if (s === null) return null;
      // 合成 POSIX 形值（自洽即可——tclsh 对一切文件系统同样如此）：
      // ino 由路径哈希、mode 按类型（0o40755 目录 / 0o100644 文件）。
      let ino = 0;
      for (let i = 0; i < path.length; i++) ino = (ino * 31 + path.charCodeAt(i)) >>> 0;
      const mode = s.dir ? 0o40755 : 0o100644;
      return Object.assign({}, s, {
        ctime: s.mtime, dev: 0, ino, nlink: 1, uid: 1000, gid: 1000,
        mode, blksize: 4096, blocks: Math.ceil(s.size / 512), link: false,
      });
    },
    settimes(path, atime, mtime) {
      path = norm(path);
      if (!files.has(path)) throw new Error("couldn't set time for \"" + path + "\": no such file");
      const f = files.get(path);
      // Rust i64 实参以 BigInt 到达——统一 Number() 归一。
      if (atime !== null && atime !== undefined) f.atime = Number(atime);
      if (mtime !== null && mtime !== undefined) f.mtime = Number(mtime);
    },
    readlink(path) {
      throw new Error("invalid argument");   // 内存 fs 无 symlink
    },
    access(path) {
      path = norm(path);
      const ok = files.has(path) || dirs.has(path);
      return { read: ok, write: true, exec: false };
    },
    mkdir(path, all) {
      path = norm(path);
      if (!all && !dirs.has(parent(path))) throw new Error('no such directory');
      touchDir(path);
    },
    delete(path) {
      path = norm(path);
      if (dirs.has(path)) {
        for (const k of [...files.keys(), ...dirs]) {
          if (k.startsWith(path + '/')) files.delete(k);
        }
        dirs.delete(path);
      } else files.delete(path);
    },
    rename(src, dst) {
      src = norm(src); dst = norm(dst);
      if (files.has(src)) { files.set(dst, files.get(src)); files.delete(src); }
      else throw new Error('no such file');
    },
    copy(src, dst) {
      src = norm(src); dst = norm(dst);
      if (!files.has(src)) throw new Error('no such file');
      files.set(dst, { data: files.get(src).data, mtime: Date.now() / 1000 | 0 });
    },
    readdir(path) {
      path = norm(path);
      const out = [];
      for (const k of dirs) if (parent(k) === path && k !== '/') out.push(base(k));
      for (const k of files.keys()) if (parent(k) === path) out.push(base(k));
      return out;
    },
    pwd() { return cwd; },
    cd(path) { cwd = norm(path); },
    readfile(path) {
      path = norm(path);
      if (!files.has(path)) throw new Error("couldn't read file \"" + path + "\"");
      return files.get(path).data;
    },
    tempfile(prefix) {
      const p = '/tmp/' + prefix + (Date.now() % 100000);
      files.set(p, { data: '', mtime: 0 });
      touchDir('/tmp');
      return p;
    },
  };
}

const rows = document.getElementById('rows');
const log  = document.getElementById('log');
const banner = document.getElementById('banner');
let nPass = 0, nFail = 0;

function rowEl(c) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="case"><div>${c.name}</div>` +
    (c.script ? `<div class="script">${esc(c.script)}</div>` : '') +
    (c.want != null ? `<div class="want">期望: ${esc(String(c.want))}</div>`
      : '<div class="want">期望: load 前初始命令计数</div>') +
    `</td><td class="res">…</td>`;
  rows.appendChild(tr);
  return tr.querySelector('.res');
}
function esc(s) {
  return String(s).replace(/[&<>]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}
function logln(s) {
  log.textContent += s + '\n';
  log.scrollTop = log.scrollHeight;
}

function mark(el, ok, got) {
  el.innerHTML = ok
    ? `<span class="pass">PASS</span>`
    : `<span class="fail">FAIL</span><div class="got">实际: ${esc(got)}</div>`;
  ok ? nPass++ : nFail++;
}

async function main() {
  const stRtcl = document.getElementById('st-rtcl');
  const stSide = document.getElementById('st-side');
  let handle = null, exportsObj = null;

  try {
    await init();
    handle = new RtclHandle();
    window.__rtcl = handle;              // 控制台/诊断入口
    // HostFs 数据面注入：内存 fs 桥（浏览器里 open/file/source/glob
    // 从"运行时必败"变为真正可用；通道协议面留原生 Rust）。
    handle.set_fs(makeMemoryFs());
    // json 子系统外置：wasm 构建不含 native json（feature 门控），
    // JS jsonmod 提供同面实现（§10quater 首个命令族外置）。
    try {
      handle.register_module('json', makeJsonMod());
      logln('[json] jsonmod registered');
    } catch (e) {
      logln('[json] register_module ERR: ' + e);
    }
    stRtcl.textContent = `ok (${handle.exec('info patchlevel')} + jsfs)`;
    const initial = handle.exec('llength [info commands]');
    window.__rtcl_initial_list = handle.exec('info commands');
    logln(`[rtcl] pkg loaded; info commands = ${initial}（清单已存 __rtcl_initial_list）`);
  } catch (e) {
    stRtcl.textContent = '加载失败';
    banner.className = 'bad';
    banner.textContent = 'rtcl pkg 加载失败：' + e;
    return;
  }

  try {
    const bytes = await (await fetch(SIDE_WASM_URL)).arrayBuffer();
    const { instance } = await WebAssembly.instantiate(bytes, {});
    const ex = instance.exports;
    logln(`[side] exports: ${Object.keys(ex).join(', ')}`);
    // 数值 ABI → 字符串包装（裸 wasm 的 i64 参数/返回是 BigInt）。
    // v2 的字符串/字节载荷走 envelope 记录表 + 静态缓冲区交接
    // （alloc 写入 → argc/echo_words 调用 → res_ptr/res_len 读出）。
    const enc = new TextEncoder();
    const dec = new TextDecoder();
    const packWords = (words) => {
      const parts = words.map((w) => enc.encode(String(w)));
      let total = 4;
      for (const p of parts) total += 4 + p.length;
      const b = new Uint8Array(total);
      const dv = new DataView(b.buffer);
      dv.setUint32(0, parts.length, true);
      let o = 4;
      for (const p of parts) {
        dv.setUint32(o, p.length, true);
        b.set(p, o + 4);
        o += 4 + p.length;
      }
      return b;
    };
    const callMyext = (fn, inBuf) => {
      const ip = ex.alloc(inBuf.length);
      new Uint8Array(ex.memory.buffer, ip, inBuf.length).set(inBuf);
      const rc = fn(ip, inBuf.length);
      const rp = ex.res_ptr();
      const rl = ex.res_len();
      return { rc, out: new Uint8Array(ex.memory.buffer, rp, rl) };
    };
    const unpackRecords = (u8) => {
      const dv = new DataView(u8.buffer, u8.byteOffset, u8.byteLength);
      const n = dv.getUint32(0, true);
      const out = [];
      let o = 4;
      for (let i = 0; i < n; i++) {
        const l = dv.getUint32(o, true);
        o += 4;
        out.push(dec.decode(new Uint8Array(u8.buffer, u8.byteOffset + o, l)));
        o += l;
      }
      return out;
    };
    exportsObj = {
      add:     (a, b) => Number(ex.add(BigInt(Math.trunc(Number(a))), BigInt(Math.trunc(Number(b))))),
      version: ()     => ex.version(),
      // v2 数据保真面：argc 报"到达词数"（拆词/丢界即刻现形），
      // echo 单词回显（逐词比对原词后返回内容）。
      argc: (...words) => callMyext(ex.argc, packWords(words)).rc,
      echo: (...words) => {
        const { rc, out } = callMyext(ex.echo_words, packWords(words));
        if (rc !== 0) throw new Error('echo_words 失败 rc=' + rc);
        const recs = unpackRecords(out);
        if (recs.length !== words.length) {
          throw new Error('echo 词数不守恒: 发 ' + words.length + ' 回 ' + recs.length);
        }
        for (let i = 0; i < recs.length; i++) {
          if (recs[i] !== words[i]) throw new Error('echo 内容失真 @' + i);
        }
        return recs[0];
      },
    };
    stSide.textContent = `ok (add(2,3)=${Number(ex.add(2n,3n))})`;
  } catch (e) {
    stSide.textContent = '加载失败';
    banner.className = 'bad';
    banner.textContent = '侧模块 myext.wasm 加载失败：' + e;
    return;
  }

  // spencermod：Spencer 全集侧模块（native 同源引擎）——与 worker 同一
  // 装载胶水，register + load + wrapper 安装。装载在命令计数基线之前
  //（T9 的"卸载后回落"以此为准）。
  let spencerOk = false;
  try {
    spencerOk = await setupSpencerMod(handle);
  } catch (e) {
    logln('[spencermod] ERR: ' + e);
  }
  logln('[spencermod] ' + (spencerOk
    ? 'loaded（native 同源引擎，::regexp/::regsub wrapper 就绪）'
    : 'unavailable（SP 区用例将失败）'));

  const initialCount = handle.exec('llength [info commands]');
  logln(`[rtcl] 初始命令计数（wasm 面）= ${initialCount}`);
  for (const c of CASES) {
    const el = rowEl(c);
    logln(`— ${c.name}`);
    try {
      if (c.id === 'T1') {
        handle.register_module('myext', exportsObj);
        // T1 的观感验证：注册表里有，但命令还没挂（未 load）
        const listed = handle.exec('info commands myext::*');
        mark(el, listed === '', `load 前 info commands myext::* = "${listed}"（应为空）`);
      } else {
        const want = c.want === null ? initialCount : c.want;
        const got = handle.exec(c.script);
        const ok = String(got) === String(want);
        mark(el, ok, got);
        logln(`  → ${ok ? 'PASS' : 'FAIL got: ' + got}`);
      }
    } catch (e) {
      mark(el, false, String(e));
      logln(`  → 异常: ${e}`);
    }
  }

  const summary = document.getElementById('st-summary');
  summary.textContent = `${nPass} pass / ${nFail} fail`;
  banner.className = nFail === 0 ? 'ok' : 'bad';
  banner.textContent = nFail === 0
    ? '✅ 全部通过 — dynmod 全链路 + 平台抽查在真机可用'
    : `❌ ${nFail} 例失败（见表格）`;
}

main();
</script>
