[package]
name = "rtcl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for rtcl"

[[bin]]
name = "rtcl"
path = "src/main.rs"

[dependencies]
rtcl-core.workspace = true
rtcl-parser.workspace = true
clap.workspace = true
rustyline.workspace = true
colored.workspace = true

[features]
default = []
# Spencer 正则引擎（已默认经 rtcl_std 开启）：显式打开供
# --no-default-features 构建；RTCL_REGEX_ENGINE=fast 可回退旧引擎。
regexp-spencer = ["rtcl-core/regexp-spencer"]
expect = ["rtcl-expect"]
# 可选 JIT（主线 opt-in）：proc-body fast-tier 直呼——命中 fast 形状
# （纯参数读/无循环/无变量写的 proc）走 wasm 直呼，其余形状保持
# 解释器（fast-only 策略，绝不落入比解释器慢的常规池路径；
# RTCL_JIT_POOL=1 可全开）。默认构建零 JIT（不依赖 rtcl-jit）。
jit = ["dep:rtcl-jit"]
# 可选 jemalloc 分配器（剖析 opt-in）：内存剖析用——构建时带
# --enable-prof（tikv-jemallocator 的 profiling feature），运行期
# MALLOC_CONF="prof:true,prof_prefix=..." 出堆快照，jeprof 出
# 火焰图/文本报表。见 bench/profile-heap.sh。默认构建不受影响。
jemalloc = ["dep:tikv-jemallocator"]
# Native Tk-compatible UI (nsh/GTK4).  Optional and native-only: enabling
# it pulls the Tk runtime + selected nsh platform backend.  It is mutually
# exclusive with wasm — rtcl-wasm never exposes this feature and the
# runtime crate has a wasm32 compile_error.
tk = ["dep:rtcl-tk-runtime"]

[dependencies.rtcl-tk-runtime]
path = "../rtcl-tk-runtime"
optional = true

[dependencies.rtcl-jit]
workspace = true
optional = true
default-features = false
features = ["jit-exec"]

# jemalloc 剖析分配器（Linux only；profiling = --enable-prof）。
[target.'cfg(target_os = "linux")'.dependencies.tikv-jemallocator]
workspace = true
optional = true
features = ["profiling"]

[dependencies.rtcl-expect]
workspace = true
optional = true
