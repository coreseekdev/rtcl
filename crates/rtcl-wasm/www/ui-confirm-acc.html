<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>rtcl ui::confirm acceptance (headless)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { font-family: monospace; background: #0d1117; color: #c9d1d9; display: flex; flex-direction: column; }
  main { flex: 1; display: flex; min-height: 0; }
  #term { flex: 1; border-right: 1px solid #30363d; min-width: 0; overflow: auto; }
  #ui-root { flex: 1; overflow-y: auto; min-width: 0; }
  #acc { position: fixed; bottom: 0; left: 0; right: 0; max-height: 38vh; overflow: auto; background:#010409; color:#7ee787; font-size:11px; padding:6px 10px; border-top:1px solid #30363d; white-space:pre-wrap; z-index: 9; }
</style>
</head>
<body>
<main>
  <div id="term"></div>
  <div id="ui-root"></div>
</main>
<pre id="acc">booting…</pre>
<!-- 堵住 load 事件（--dump-dom --timeout 只能到点转储，页面真实任务先跑完） -->
<img src="http://127.0.0.1:8766/hang" style="display:none" alt="">
<script type="module">
import init, { RtclHandle } from '../pkg/rtcl_wasm.js';
import { createUiRuntime, registerDomRenderers, injectUiStyles } from './ui-runtime.js';
import { createShell } from './shell.js';

const acc = document.getElementById('acc');
let accLines = [];
const log = (s, mark) => { accLines.push((mark ? '  ' + mark + ' ' : '') + s); acc.textContent = accLines.join('\n'); };

const nativeRaf = window.requestAnimationFrame.bind(window);
window.requestAnimationFrame = (cb) => { nativeRaf(cb); setTimeout(() => cb(0), 0); return 0; };

const shell = createShell(document.getElementById('term'), {
  exec: (s) => { if (!rtcl) throw new Error('WASM 尚未就绪'); return rtcl.exec(s); },
  isComplete: (s) => (rtcl ? rtcl.is_complete(s) : true),
});
const brace = (s) => '{' + s.replace(/\\/g, '\\\\').replace(/\{/g, '\\{').replace(/\}/g, '\\}') + '}';

let rtcl = null;

async function main() {
  await init();
  rtcl = new RtclHandle();
  rtcl.set_output_handler((s) => shell.print(s.replace(/\n$/, ''), 'puts'));
  injectUiStyles();

  const fired = [];
  const fire = (path, event, detail) => {
    fired.push([path, event, detail]);
    try {
      rtcl.dispatch_event(detail === undefined
        ? `::ui::fire ${path} ${event}`
        : `::ui::fire ${path} ${event} ${detail}`);
    } catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };
  const commitModel = (path, value) => {
    try { rtcl.dispatch_event(`ui::model set ${path} ${brace(JSON.stringify(value))}`); }
    catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };
  const runtime = createUiRuntime(document.getElementById('ui-root'), {
    fire, commitModel,
    onError: (m) => shell.print('[ui] ' + m, 'error'),
  });
  registerDomRenderers(runtime);
  rtcl.register_command('_ui', (opsJson) => { runtime.applyOps(JSON.parse(opsJson)); return ''; });

  rtcl.exec('set tcl_interactive 1');
  window.rtcl = rtcl;

  // ── 与 demo 相同：Danger zone 卡 + 一个 cancel 用例 ──
  // bind 类回写用 configure 重新武装（-preview 字符串 = 消息文字）。
  rtcl.exec(`
ui::batch {
  ui::surface .z -title "Danger zone"
  ui::text .z.hint -variant caption -text "modal action: -command fires async on Confirm"
  ui::confirm .z.conf -danger 1 \\
      -preview {{"action":"delete issue","issue":"SENTRY-42","affected":3}} \\
      -command {puts "CONFIRMED-A (async)"; ui::configure .z.conf -preview {"executed — re-armed"}}
}
ui::on .z.conf cancel {puts "cancelled-A"}
ui::batch {
  ui::surface .n -title "Non-destructive"
  ui::confirm .n.conf -command {puts "CONFIRMED-B"}
}
ui::batch {
  ui::surface .r -title "Cancel path"
  ui::confirm .r.conf -command {puts "CONFIRMED-C"}
}
ui::on .r.conf cancel {puts "cancelled-C"}
puts "scripts-continued"
`);

  acceptance(runtime, fired).catch(e => log('harness error: ' + (e && e.message || e), 'ERR'));
}

async function acceptance(runtime, fired) {
  await new Promise(r => setTimeout(r, 0));

  // 1) catalog 内省
  const cat = rtcl.exec('ui::catalog Confirm');
  const catOk = cat.includes('-danger') && cat.includes('-preview') && cat.includes('-command') && cat.includes('-weight');
  log(`catalog Confirm introspection ${catOk ? 'OK' : 'FAIL'}`, '[1]');

  const term = document.getElementById('term');

  // 2) 非阻塞证据：创建脚本跑到底（scripts-continued 已打出），此刻尚未有任何点击
  const nonBlocking = term.textContent.includes('scripts-continued') && fired.length === 0;
  log(`creating script ran to completion before any click (no vwait) ${nonBlocking ? 'OK' : 'FAIL'}`, '[2]');

  // 3) 卡片渲染：danger + 缩进 JSON 预览 + 双按钮
  const cardEl = document.querySelector('.rui-confirm');
  const st = cardEl._confirm;
  const pre = cardEl.querySelector('.rui-confirm-prev');
  const renderOk = cardEl.className.includes('rui-confirm-danger')
    && pre && pre.textContent.includes('"issue": "SENTRY-42"')
    && cardEl.querySelector('.rui-confirm-ok').textContent === 'Confirm';
  log(`danger card + indented JSON preview ${renderOk ? 'OK' : 'FAIL'}`, '[3]');

  // 4) 点 Confirm：命令异步跑；-command 里的 configure 同步重新武装
  //    （demo 语义：确认后换消息态，可再问）——此处断言"已重武装"
  const zCard = document.querySelectorAll('.rui-confirm')[0];
  zCard.querySelector('.rui-confirm-ok').click();
  await new Promise(r => setTimeout(r, 0));
  const okFired = fired.filter(f => f[0] === '.z.conf' && f[1] === 'ok').length;
  const okRan = term.textContent.includes('CONFIRMED-A (async)');
  const rearmed = !zCard.className.includes('rui-confirm-done')
    && zCard.querySelector('.rui-confirm-ok').disabled === false
    && zCard.querySelector('.rui-confirm-msg')?.textContent === 'executed — re-armed';
  log(`Confirm -> ok x${okFired}, command ran=${okRan}, re-armed by command=${rearmed}`, '[4]');
  const decideOk = okFired === 1 && okRan && rearmed;

  // 5) 重武装后再点再跑（复用同一卡片）
  zCard.querySelector('.rui-confirm-ok').click();
  await new Promise(r => setTimeout(r, 0));
  const ranTwice = term.textContent.split('CONFIRMED-A (async)').length - 1 === 2;
  log(`re-armed card runs again (CONFIRMED-A x2) ${ranTwice ? 'OK' : 'FAIL'}`, '[5]');

  // 6) 决定后禁用 + 防双击（用不重武装的 .n 卡）
  const nCard = document.querySelectorAll('.rui-confirm')[1];
  nCard.querySelector('.rui-confirm-ok').click();
  await new Promise(r => setTimeout(r, 0));
  const nDisabled = nCard.querySelector('.rui-confirm-ok').disabled && nCard.querySelector('.rui-confirm-cancel').disabled;
  nCard.querySelector('.rui-confirm-ok').click();
  nCard.querySelector('.rui-confirm-ok').click();
  await new Promise(r => setTimeout(r, 0));
  const nFired = fired.filter(f => f[0] === '.n.conf' && f[1] === 'ok').length;
  const noDouble = nDisabled && nFired === 1 && term.textContent.includes('CONFIRMED-B');
  log(`decision disables buttons=${nDisabled}; extra clicks fire ${nFired}x ${noDouble ? 'OK' : 'FAIL'}`, '[6]');

  // 7) Cancel 路径（第三张卡仍未决定）
  const rCard = document.querySelectorAll('.rui-confirm')[2];
  rCard.querySelector('.rui-confirm-cancel').click();
  await new Promise(r => setTimeout(r, 0));
  const bCancelled = term.textContent.includes('cancelled-C');
  const bNoOk = fired.filter(f => f[0] === '.r.conf' && f[1] === 'ok').length === 0;
  const bCancelFired = fired.filter(f => f[0] === '.r.conf' && f[1] === 'cancel').length === 1;
  log(`Cancel -> cancel x${bCancelFired} (no ok=${bNoOk}), handler ran=${bCancelled}`, '[7]');
  const cancelOk = bCancelled && bNoOk && bCancelFired;
  const all = catOk && nonBlocking && renderOk && decideOk && ranTwice && noDouble && cancelOk;
  log(`VERDICT: ${all ? 'PASS' : 'FAIL'}`, 'END');
  acc.title = all ? 'acc-pass' : 'acc-fail';
}

main().catch((e) => {
  log('failed to init: ' + (e && e.message || e), 'ERR');
});
</script>
</body>
</html>
