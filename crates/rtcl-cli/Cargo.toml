[package]
name = "rtcl-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for rtcl"

[[bin]]
name = "rtcl"
path = "src/main.rs"

[dependencies]
rtcl-core.workspace = true
rtcl-parser.workspace = true
clap.workspace = true
rustyline.workspace = true
colored.workspace = true
anyhow.workspace = true
annotate-snippets.workspace = true

[features]
default = []
expect = ["rtcl-expect"]
# native HTTP 宿主动力（rtcl-native 的 reqwest blocking 服务）。默认关闭，
# 只有显式 `--features net` 的构建携带网络实现。
net = ["dep:rtcl-native", "rtcl-native/net"]

[dependencies.rtcl-expect]
workspace = true
optional = true

# net feature：native 宿主服务（HostHttp + __rtcl_http 桥，实现在
# crates/rtcl-native；rtcl-cli 只负责装配）。
[dependencies.rtcl-native]
workspace = true
optional = true
