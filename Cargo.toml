[workspace]
resolver = "2"
members = [
    "crates/rtcl-ir",
    "crates/rtcl-parser",
    "crates/rtcl-unicode",
    "crates/rtcl-regexp-spencer",
    "crates/rtcl-vm",
    "crates/rtcl-core",
    "crates/rtcl-cli",
    "crates/rtcl-expect",
    "crates/rtcl-wasm",
    "crates/rtcl-jit",
    "crates/rtcl-towasm",
    "crates/rtcl-data", "crates/rtcl-tk-core", "crates/rtcl-tk-runtime", "crates/rtcl-tk-nsh",
    "crates/rtcl-native",
    "apps/rtcl-tk-demo",
    "apps/rtcl-tk-app/native",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-2-Clause"
repository = "https://github.com/user/rtcl"
description = "A lightweight Tcl-compatible scripting language in Rust"
authors = ["rtcl contributors"]
rust-version = "1.70"

[workspace.dependencies]
rtcl-ir = { path = "crates/rtcl-ir" }
rtcl-parser = { path = "crates/rtcl-parser" }
rtcl-unicode = { path = "crates/rtcl-unicode" }
rtcl-regexp-spencer = { path = "crates/rtcl-regexp-spencer" }
rtcl-vm = { path = "crates/rtcl-vm" }
# 供 rtcl-cli 的可选 jit 特性经 workspace 继承引用（安全子集与
# rtcl-jit 自身声明一致——env/exec/signal 排除）。
rtcl-jit = { path = "crates/rtcl-jit", default-features = false }
rtcl-core = { path = "crates/rtcl-core" }
rtcl-expect = { path = "crates/rtcl-expect" }

# no-std compatible dependencies
hashbrown = "0.14"
smallvec = { version = "1.13", default-features = false }
spin = "0.9"

# std dependencies
indexmap = "2.2"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rustyline = "14.0"
colored = "2.1"
# jemalloc 剖析分配器（rtcl-cli 的 jemalloc feature；profiling =
# --enable-prof，供 MALLOC_CONF 堆快照 + jeprof 报表）。
tikv-jemallocator = { version = "0.6", default-features = false, features = ["profiling", "unprefixed_malloc_on_supported_platforms"] }
regex = "1"
regex-lite = "0.1"
# D5（specs/ARCH-DESIGN-20261126.md）：alloc-only（无 std/rand）——
# 值表示层直接持 Rc<BigInt> 堆箱；no_std/wasm 兼容面由它保证。
num-bigint = { version = "0.4", default-features = false }
num-traits = "0.2"
num-integer = "0.1"
rtcl-data = { path = "crates/rtcl-data" }
rtcl-native = { path = "crates/rtcl-native" }
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
serde_yaml = "0.9"
# native HTTP（rtcl-cli 的 net feature）：blocking + rustls，无 openssl。
# rogo R0 探针（2026-10-18）；若后续换实现只影响 HostHttp 背后。
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"

# Tk compatibility patches carried on the coreseekdev fork: the slider
# reports PressStart so a Tk scale can dispatch <Button-1>.
[patch.crates-io]
nsh-core = { git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
nsh-base = { git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
nsh-engine = { git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
nsh-testing = { git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }
nsh-platform-linux = { git = "ssh://git@github.com/coreseekdev/nsh", branch = "rtcl-tk" }

[profile.release]
opt-level = 3        # Optimize for speed
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization
panic = "abort"      # Smaller binary
strip = true         # Strip symbols

# size 轨（wasi 招②增量，docs/MODULARIZATION.md §5）：opt-s 换尺寸——
# wasi 线同族实测 opt3→opt-s raw −15%、运行时 −40-50%。只用于尺寸
# 敏感的嵌入分发（build.sh --size 第二产物 *_size.wasm）；dispatcher
# 真机面恒走 perf 轨（release）。
[profile.wasm-size]
inherits = "release"
opt-level = "s"

[profile.dev]
opt-level = 0
