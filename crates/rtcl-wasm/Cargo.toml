[package]
name = "rtcl-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for rtcl Tcl interpreter"

[dependencies]
rtcl-core = { path = "../rtcl-core", default-features = false, features = ["std"] }
rtcl-parser = { path = "../rtcl-parser" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# default-features=false：rtcl-vm 默认 rtcl_std 含 env（$env 镜像在
# Interp::new 里 std::env::vars()——wasm32-unknown-unknown 无 env 支持，
# 构造即 panic）。显式子集去掉 env/exec/signal（无 OS 语义）；regexp
# 外置（wasm 子集不含 regexp-lite——regexp/regsub 经 dynmod 注入 JS
# 实现，见 www/regexpmod.js；native 默认 rtcl_std 含 spencer/lite）。
# clock/package 外置（2026-11-19 方案 a：JS dynmod——
# www/clockpkgmod.js 补回同面命令，计数面零变化；wasm 的 clock 本是
# UTC-only stub〔libc 不进 wasm〕，JS 面带本地时区 + IANA -timezone，
# 属功能升级；docs/MODULARIZATION.md）。
# 双轨 feature（D6 Core Profile，specs/ARCH-DESIGN-20261126.md）：
#   std-track（默认，行为同既往单轨）= std,file,io,dynmod,json,ext
#   core（opt-in，--no-default-features --features core）
#     = std,io,dynmod——核心语言 + expr + list/dict/string + channel
#       内存面 + OO；关掉 file/json/36 项扩展 std-only 部分（vm ext
#       feature）与 ui/http/log/rules 词表层（lib.rs cfg）。regexp/
#       clock/package/encoding 本就不在 wasm 组合里（JS dynmod 面）。
rtcl-vm = { path = "../rtcl-vm", default-features = false }
# json 外置：wasm 构建不含（页面经 register_module 注入 JS jsonmod，
# 见 www/dynmod-test.html J 区段）；native 默认含（rtcl_std）。
# wasm32 JIT 接线（⑧ 重入哨兵已就位）：wasmi 是纯 Rust——在
# wasm32 里跑 wasm（解释器套解释器，比 JS WebAssembly API 路径慢
# 但零 JS 侧代码，全量复用池/协议/错误帧）。默认关——wasm32 包体
# 敏感，嵌入方按需开。
rtcl-jit = { path = "../rtcl-jit", optional = true, features = ["jit-exec"] }

[features]
# std 默认轨（wasm dispatcher 全量面；默认构建行为不变）。
default = ["std-track"]
std-track = [
    "rtcl-vm/std",
    "rtcl-vm/file",
    "rtcl-vm/io",
    "rtcl-vm/dynmod",
    "rtcl-vm/json",
    "rtcl-vm/ext",
]
# Core Profile（build.sh --core → *_core.wasm）：wasm 网页应用最小化
# command script 核心。体积红线：wasm-bindgen+wasm-opt 后 ≤1.5MB。
core = ["rtcl-vm/std", "rtcl-vm/io", "rtcl-vm/dynmod"]
jit = ["dep:rtcl-jit"]

[lib]
crate-type = ["cdylib", "rlib"]
