<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rtcl ui demo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column;
  }
  header {
    padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d;
    font-size: 13px; color: #8b949e; display: flex; align-items: center; gap: 10px;
  }
  header b { color: #7ee787; font-weight: normal; }
  #status { margin-left: auto; font-size: 12px; }
  #status.ok { color: #3fb950; }
  #status.err { color: #f85149; }
  main { flex: 1; display: flex; min-height: 0; }
  #term { flex: 1; border-right: 1px solid #30363d; min-width: 0; }
  #ui-root { flex: 1; overflow-y: auto; min-width: 0; }
</style>
</head>
<body>
<header>
  <b>rtcl</b> ui demo — 左侧 shell，右侧 ui::* 即时面板
  <span id="status">loading WASM…</span>
</header>
<main>
  <div id="term"></div>
  <div id="ui-root"></div>
</main>
<script type="module">
import init, { RtclHandle } from '../pkg/rtcl_wasm.js';
import { createUiRuntime, registerDomRenderers, injectUiStyles } from './ui-runtime.js';
import { createShell } from './shell.js';
import { installHttpBridge } from './http-bridge.js';
import { startHeartbeat } from './event-loop.js';

const status = document.getElementById('status');

let rtcl = null;
const shell = createShell(document.getElementById('term'), {
  exec: (s) => {
    if (!rtcl) throw new Error('WASM 尚未就绪');
    return rtcl.exec(s);
  },
  isComplete: (s) => (rtcl ? rtcl.is_complete(s) : true),
});

// Tcl 大括号引用：内层 } 与 \ 转义（嵌套 {} 自然平衡）
// Tcl 双引号词转义（无损；花括号转义在 Tcl 里有损：\\ 原样保留）
const brace = (s) => '"' + String(s)
  .replace(/\\/g, '\\\\').replace(/"/g, '\\"')
  .replace(/\$/g, '\\$').replace(/\[/g, '\\[') + '"';

async function main() {
  await init();
  rtcl = new RtclHandle();
  rtcl.set_output_handler((s) => shell.print(s.replace(/\n$/, ''), 'puts'));
  injectUiStyles();
  installHttpBridge(rtcl, { onError: (m) => shell.print('[http] ' + m, 'error') });
  // wasm 主线程形态的自发事件循环：心跳把到点的 after 事件泵出来
  // （rules::* 规则、after 轮询都靠它流动）
  startHeartbeat(rtcl, { intervalMs: 50, onError: (m) => shell.print('[hb] ' + m, 'error') });

  // 事件回灌：JS 组件事件 → Tcl 回调（契约 §2.4）。第三参 = 行级
  // detail（ui::table 下标），拼成 "::ui::fire <path> <ev> <detail>"。
  const fire = (path, event, detail) => {
    try {
      rtcl.dispatch_event(detail === undefined
        ? `::ui::fire ${path} ${event}`
        : `::ui::fire ${path} ${event} ${detail}`);
    }
    catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };
  // 输入组件提交：本地编辑回写 Tcl 模型（契约 §2.2）
  const commitModel = (path, value) => {
    try { rtcl.dispatch_event(`ui::model set ${path} ${brace(JSON.stringify(value))}`); }
    catch (e) { shell.print(String(e && e.message || e), 'error'); }
  };

  const runtime = createUiRuntime(document.getElementById('ui-root'), {
    fire,
    commitModel,
    onError: (m) => shell.print('[ui] ' + m, 'error'),
  });
  registerDomRenderers(runtime);

  // _ui 是唯一桥命令：词表层送来的 op JSON 数组在此汇聚（契约 §3）
  rtcl.register_command('_ui', (opsJson) => {
    runtime.applyOps(JSON.parse(opsJson));
    return '';
  });

  rtcl.exec('set tcl_interactive 1');
  window.rtcl = rtcl;

  // M4 验收：6 行 counter + 一个验证 model/bind 回路的表单面板
  rtcl.exec(`
set ::n 0
ui::batch {
  ui::surface .s -title Counter
  ui::column .s.main
  ui::text .s.main.count -text 0
  ui::button .s.main.inc -text +1 -command {ui::configure .s.main.count -text [incr ::n]}
}
ui::model set /name ""
ui::model set /enabled false
ui::batch {
  ui::surface .f -title Form
  ui::column .f.main
  ui::field .f.main.name -label Name -path /name
  ui::checkbox .f.main.ok -label Enabled -path /enabled
  ui::button .f.main.dump -text Dump -command {puts "name=\[ui::model get /name\] enabled=\[ui::model get /enabled\]"}
}
`);

  // M5: ui::table —— 虚拟滚动 + 行级增量。喂数不预置 /pods（dict set
  // 自动建父，tclsh 同源语义）；行 JSON 双大括号字面量（引词规则，
  // 见 rtcl-core/src/ui.tcl Table 注释）。行点击经 rowopen/rowdel/
  // rowclick 回灌，脚本里 $ui_row = 行号（::ui::fire 第三参）。
  rtcl.exec(`
ui::batch {
  ui::surface .p -title Pods
  ui::text .p.hint -variant caption -text "feed: feedpods 100000 · click a row"
  ui::table .p.table -path /pods -columns {name status restarts age} -weight 1 \\
      -rowactions {open {puts "open \\#$ui_row: [ui::model get /pods/$ui_row]"} \\
                   del  {puts "del  \\#$ui_row"}}
}
ui::on .p.table rowclick {
  puts "rowclick \\#$ui_row"
  # 行值在模型里是原始 JSON 串：原样转喂 /pod，kv/tree 拿到的是 JSON 对象
  ui::model set /pod [ui::model get /pods/$ui_row]
}
ui::batch {
  ui::surface .pd -title "Pod detail"
  ui::text .pd.hint -variant caption -text "kv + tree share /pod (click a Pods row)"
  ui::row .pd.pair
  ui::kv .pd.pair.kv -path /pod -keys {name status restarts age} -weight 1
  ui::tree .pd.pair.tree -path /pod -weight 1
}
`);

  // 10 万行游标喂数（分批 ui::batch 每片一个过桥；协议一次一行）。
  // 加载中 shell 仍可交互（W/Tcl 每片让回事件循环）。
  rtcl.exec(`
proc feedpods {n {chunk 2000}} {
    set statuses {Running Pending CrashLoopBackOff Succeeded Failed}
    set fed 0
    while {$fed < $n} {
        set k [expr {$fed + $chunk > $n ? $n - $fed : $chunk}]
        ui::batch {
            for {set j 0} {$j < $k} {incr j} {
                set i [expr {$fed + $j}]
                ui::model set /pods/$i [format {{"name":"pod-%06d","status":"%s","restarts":%d,"age":"%dh"}} \
                    $i [lindex $statuses [expr {$i % 5}]] [expr {$i % 7}] [expr {1 + $i % 720}]]
            }
        }
        set fed [expr {$fed + $k}]
    }
    return "fed $fed rows"
}
`);

  // M8: ui::chart —— Vega-Lite 子集（线图）。数据走 model 通道：
  // spec.data.name 指向 /cpu，feedcpu 游标 append，spec 不变只重绘。
  rtcl.exec(`
ui::batch {
  ui::surface .ch -title "CPU (streaming)"
  ui::text .ch.hint -variant caption -text "feed: feedcpu 200 · data via /cpu, spec unchanged"
  ui::chart .ch.line -vegalite {
    {"data":{"name":"/cpu"},
     "mark":"line",
     "encoding":{"x":{"field":"t"},"y":{"field":"v","type":"quantitative"}}}
  } -weight 1
}
set ::cpucursor 0
proc feedcpu {n {chunk 50}} {
    set fed 0
    while {$fed < $n} {
        set k [expr {$fed + $chunk > $n ? $n - $fed : $chunk}]
        ui::batch {
            for {set j 0} {$j < $k} {incr j} {
                set i [expr {$::cpucursor + $j}]
                ui::model set /cpu/$i [format {{"t":"%02d:%02d","v":%.1f}} [expr {($i / 60) % 60}] [expr {$i % 60}] [expr {50 + 30 * sin($i / 9.0)}]]
            }
        }
        set ::cpucursor [expr {$::cpucursor + $k}]
        set fed [expr {$fed + $k}]
    }
    return "fed $fed points (total $::cpucursor)"
}
`);

  // M9: ui::trace —— span 树瀑布（甘特条 + 折叠/缩放全客户端）
  rtcl.exec(`
ui::batch {
  ui::surface .t -title "Trace (http.request)"
  ui::text .t.hint -variant caption -text "click name = fold · click bar = zoom to span (click again / track = reset)"
  ui::trace .t.tr -path /trace -weight 1
}
ui::model set /trace {{"name":"http.request","start_ms":0,"dur_ms":240,"children":[{"name":"db.query","start_ms":10,"dur_ms":120,"children":[{"name":"SELECT","start_ms":15,"dur_ms":40,"children":[]},{"name":"index scan","start_ms":60,"dur_ms":60,"children":[]}]},{"name":"cache.get","start_ms":140,"dur_ms":30,"children":[]},{"name":"serialize","start_ms":175,"dur_ms":60,"children":[]}]}}
`);

  // M6: ui::log —— 追加式日志流。行值 JSON 对象的 level 字段着色
  // （info/warn/error/debug，样式在 ui-runtime.js 的 CSS）；标量行
  // 值视为 info。上滚暂停跟随、回底自动恢复。行点击经 lineclick
  // 回灌（ui::on 绑定；$ui_row = 行号）。
  rtcl.exec(`
ui::batch {
  ui::surface .d -title "Deploy log"
  ui::text .d.hint -variant caption -text "feed: feedlog 20000 · click a line"
  ui::log .d.log -path /deploylog -weight 1
}
ui::on .d.log lineclick {puts "lineclick \\#$ui_row: [ui::model get /deploylog/$ui_row]"}
set ::logcursor 0
`);

  // 游标追加（同 feedpods：每片一个 ui::batch；format 参数与命令同
  // 物理行——[...] 内换行即命令终结符）。
  rtcl.exec(`
proc feedlog {n {chunk 2000}} {
    # 全局游标：重复调用是追加，不是从 0 重写（日志语义）
    set levels {info warn error debug}
    set fed 0
    while {$fed < $n} {
        set k [expr {$fed + $chunk > $n ? $n - $fed : $chunk}]
        ui::batch {
            for {set j 0} {$j < $k} {incr j} {
                set i [expr {$::logcursor + $j}]
                ui::model set /deploylog/$i [format {{"ts":"00:%02d:%02d","level":"%s","text":"step %d: pipeline %s (pid %d)"}} [expr {($i / 60) % 60}] [expr {$i % 60}] [lindex $levels [expr {$i % 4}]] $i [lindex $levels [expr {$i % 4}]] [expr {4000 + $i % 900}]]
            }
        }
        set ::logcursor [expr {$::logcursor + $k}]
        set fed [expr {$fed + $k}]
    }
    return "fed $fed lines (total $::logcursor)"
}
`);

  // M10: ui::confirm —— 模态动作异步回灌（禁 vwait）。-command 绑 ok
  // 事件；Cancel 回灌 cancel（ui::on 绑定）。configure 改 preview 会
  // 重新武装——demo 里 Confirm 后换成结果消息，可反复点。
  rtcl.exec(`
ui::batch {
  ui::surface .z -title "Danger zone"
  ui::text .z.hint -variant caption -text "modal action: -command fires async on Confirm (script never blocks)"
  ui::confirm .z.conf -danger 1 \\
      -preview {{"action":"delete issue","issue":"SENTRY-42","affected":3}} \\
      -command {puts "CONFIRMED (async): would delete SENTRY-42 · 3 affected"; ui::configure .z.conf -preview {"executed — configure re-arms for the next question"}}
}
ui::on .z.conf cancel {puts "cancelled — no action taken"}
`);

  // M11: ui::form —— schema 驱动表单。值以模型为准（-path 基路径，
  // 字段 <prop> 读写 /issue/<prop>）；击键不触 Tcl，变更才回写；
  // Submit 先客户端校验（required），通过才回灌 commit（-command）。
  rtcl.exec(`
ui::batch {
  ui::surface .n -title "New issue"
  ui::text .n.hint -variant caption -text "form: type a title, pick severity, Submit (required: title + urgent)"
  ui::form .n.form -path /issue -schema {
    {"type":"object",
     "properties":{
       "title":{"type":"string","title":"Title"},
       "severity":{"enum":["low","medium","high","critical"],"title":"Severity"},
       "note":{"type":"string","title":"Note"},
       "urgent":{"type":"boolean","title":"Urgent"}},
     "required":["title","urgent"]}
  } -command {
    set vals {}
    foreach k {title severity note urgent} {
      if {![catch {ui::model get /issue/$k} v]} { lappend vals "$k=$v" }
    }
    puts "submit: [join $vals {, }]"
    ui::configure .n.hint -text "submitted: [ui::model get /issue/title]"
  }
}
`);

  // L2 数据通道（ROADMAP §3）：wasm http 客户端。pull 拉 JSON Lines →
  // 逐行喂 /pull（log 组件按 level 上色）。fetch 在 JS 里跑，回调
  // 异步回灌（禁 vwait）。
  rtcl.exec(`
ui::batch {
  ui::surface .r -title "Remote pull"
  ui::text .r.hint -variant caption -text "try: pull http://127.0.0.1:8767/lines ; then: qt level"
  ui::log .r.log -path /pull -weight 1
}
ui::batch {
  ui::surface .q -title "Query (log::top)"
  ui::text .q.hint -variant caption -text "feedq 2000 ; qt level · qt ms  (查询管道 → 表)"
  ui::table .q.table -path /qrows -columns {value count} -weight 1
}
set ::pullcursor 0
set ::qrows 0
proc pull {url} {
    http::get $url -command {
        if {$http_error ne ""} { puts "pull failed: $http_error"; return }
        set n [log::ingest-lines $http_body -source http]
        set i 0
        foreach line [http::jsonl $http_body] {
            ui::model set /pull/$::pullcursor $line
            incr ::pullcursor
            incr i
        }
        puts "pulled $i lines (status $http_status; log::count [log::count])"
    }
}
proc feedq {n} {
    set levels {info warn error debug}
    set batch [list]
    for {set i 0} {$i < $n} {incr i} {
        lappend batch [format {{"level":"%s","ms":%d,"i":%d}} [lindex $levels [expr {$i % 4}]] [expr {$i % 97}] $i]
    }
    log::ingest-lines [join $batch \\n] -source gen
    return "ingested $n (log::count [log::count])"
}
proc qt {field} {
    set new [log::top $field 20]
    set n [expr {[llength $new] / 2}]
    set i 0
    ui::batch {
        foreach {v c} $new {
            ui::model set /qrows/$i [format {{"value":%s,"count":%d}} [json encode $v str] $c]
            incr i
        }
        while {$i < $::qrows} { ui::model unset /qrows/$i ; incr i }
    }
    set ::qrows $n
    return "top $field: $n rows"
}
`);

  // M12: rules::* —— 规则/告警引擎（after 轮询 + 心跳驱动）。规则即
  // 脚本：条件沿触发（去抖），动作写 /alerts 进 log 组件。试试：
  // set ::load 92 / set ::load 20 / rules::list
  rtcl.exec(`
ui::batch {
  ui::surface .a -title "Alerts (rules::*)"
  ui::text .a.hint -variant caption -text "try: set ::load 92   (rule: load > 85, edge-triggered)"
  ui::log .a.log -path /alerts -weight 1
}
set ::load 10
set ::alertseq 0
rules::add loadwatch -every 200 -when {expr {$::load > 85}} -do {
    ui::model set /alerts/$::alertseq [format {{"level":"error","text":"load %d%% exceeds 85%% (loadwatch)"}} $::load]
    incr ::alertseq
}
`);

  shell.print('rtcl ' + (rtcl.exec('info patchlevel') || '') + ' — ui demo ready.', 'result');
  shell.print('try:  % ui::text .s.main.note -text hello -variant caption', 'hint');
  shell.print('      % feedpods 100000        ;# 10 万行游标喂数 → .p 表格', 'hint');
  shell.print('      % feedlog 20000          ;# 2 万行流式追加 → .d 日志', 'hint');
  shell.print('      % feedcpu 200            ;# 200 点流式喂数 → .ch 图表', 'hint');
  shell.print('      % ui::catalog Table      |   % ui::model get /name', 'hint');
  shell.focus();
  status.textContent = 'ready';
  status.className = 'ok';
}

main().catch((e) => {
  status.textContent = 'error: ' + (e && e.message || e);
  status.className = 'err';
  shell.print('failed to init: ' + (e && e.message || e), 'error');
});
</script>
</body>
</html>
