<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>rtcl OPFS worker 形态 — 文件 io 持久化真机测试</title>
<style>
  :root { color-scheme: dark; }
  body { font: 14px/1.5 ui-monospace, "JetBrains Mono", Menlo, monospace;
         background: #11141a; color: #d6deeb; margin: 0; padding: 24px; }
  h1 { font-size: 18px; margin: 0 0 4px; color: #82aaff; }
  .sub { color: #7f8c9b; margin-bottom: 18px; }
  #bar { display: flex; gap: 12px; margin: 12px 0 18px; align-items: baseline; flex-wrap: wrap; }
  #bar .chip { padding: 2px 10px; border-radius: 12px; background: #1c2230; }
  table { border-collapse: collapse; width: 100%; margin-bottom: 18px; }
  td, th { padding: 6px 10px; border-bottom: 1px solid #232a38; text-align: left;
           vertical-align: top; }
  th { color: #82aaff; font-weight: 600; }
  td.case { width: 42%; }
  .pass { color: #7ee787; }
  .fail { color: #ff7b72; }
  .want, .got { color: #9fb0c3; white-space: pre-wrap; }
  .script { color: #c792ea; white-space: pre-wrap; }
  #banner { padding: 8px 14px; border-radius: 8px; margin: 10px 0 18px; font-weight: 700; }
  #banner.ok  { background: #14301f; color: #7ee787; border: 1px solid #2ea043; }
  #banner.bad { background: #3a1512; color: #ff7b72; border: 1px solid #f85149; }
  #persist { color: #d2a8ff; margin-bottom: 12px; }
</style>
</head>
<body>
<h1>rtcl OPFS worker 形态 — 文件 io 持久化真机测试</h1>
<div class="sub">解释器整体运行于 module worker（dispatcher 真实部署形态）；文件数据面 =
  OPFS 影子权威 + write-behind 回写（exec 返回后微任务落盘）。settimes/stat
  13 键由影子元数据全支持。</div>

<div id="bar">
  <span class="chip">worker: <b id="st-worker">…</b></span>
  <span class="chip">fs: <b id="st-fs">…</b></span>
  <span class="chip" id="st-summary"></span>
</div>
<div id="persist"></div>
<div id="banner">等待 worker…</div>

<table>
  <thead><tr><th>用例</th><th>结果</th></tr></thead>
  <tbody id="rows"></tbody>
</table>

<div id="log"></div>

<script>
window.onerror = function(msg, src, line, col) {
  var b = document.getElementById('banner');
  if (b) { b.className = 'bad'; b.textContent = 'PAGE-ERR: ' + msg + ' @' + src + ':' + line + ':' + col; }
};
window.addEventListener('unhandledrejection', function(ev) {
  var b = document.getElementById('banner');
  if (b) { b.className = 'bad'; b.textContent = 'PAGE-REJ: ' + (ev.reason && ev.reason.stack || ev.reason); }
});
</script>
<script type="module">
// SAB 同步桥接线：fs-worker 执行真实 async OPFS，解释器 worker 的同步
// HostFs 调用经 Atomics.wait 阻塞等待其回执——回执在 OPFS 写入完成后
// 发出（严格 durable）。
const sab = new SharedArrayBuffer(256 * 1024 + 64);
const V = location.search.replace('?v=', '') || String(Date.now());
const fsWorker = new Worker('fs-worker.js?v=' + V, { type: 'module' });
const worker = new Worker('rtcl-worker.js?v=' + V, { type: 'module' });
// MessageChannel：interp worker（port1）↔ fs worker（port2）的调用通道
const ch = new MessageChannel();
fsWorker.postMessage({ sab, port: ch.port2 }, [ch.port2]);
worker.postMessage({ sab, fsPort: ch.port1 }, [ch.port1]);

const CASES = [
  { name: 'O1 open w → puts → close（写入 OPFS 影子）',
    script: 'file mkdir /demo; set f [open /demo/hello.txt w]; puts $f "hello opfs"; close $f; list [file exists /demo/hello.txt] [file size /demo/hello.txt]',
    want: '1 11' },
  { name: 'O2 open r → gets（读回）',
    script: 'set g [open /demo/hello.txt r]; set line [gets $g]; close $g; set line',
    want: 'hello opfs' },
  { name: 'O3 read 全读（含行尾换行）',
    script: 'set h [open /demo/hello.txt r]; set s [read $h]; close $h; set s',
    want: 'hello opfs\n' },
  { name: 'O4 file exists/size/type',
    script: 'list [file exists /demo/hello.txt] [file size /demo/hello.txt] [file type /demo/hello.txt]',
    want: '1 11 file' },
  { name: 'O5 file mkdir/readdir（影子目录索引）',
    script: 'file mkdir /demo/sub; set f [open /demo/sub/x.txt w]; close $f; lsort [readdir /demo]',
    want: 'hello.txt sub' },
  { name: 'O6 glob 经宿主数据面',
    script: 'lsort [glob /demo/sub/*]',
    want: '/demo/sub/x.txt' },
  { name: 'O7 file mtime name time（settimes 影子元数据）',
    script: 'file mtime /demo/hello.txt 1000000000; file mtime /demo/hello.txt',
    want: '1000000000' },
  { name: 'O8 file stat 13 键全形',
    script: 'file stat /demo/hello.txt arr; list [llength [array names arr]] $arr(type) $arr(blksize)',
    want: '13 file 4096' },
  { name: 'O9 file rename/copy/delete',
    script: 'file rename /demo/sub/x.txt /demo/sub/y.txt; file copy /demo/sub/y.txt /demo/sub/z.txt; list [file exists /demo/sub/x.txt] [file exists /demo/sub/y.txt] [file exists /demo/sub/z.txt]',
    want: '0 1 1' },
  { name: 'O10 source（宿主数据面 eval）',
    script: 'set f [open /demo/prog.tcl w]; puts $f {set loaded 42}; close $f; source /demo/prog.tcl; set loaded',
    want: '42' },
  { name: 'O11 seek/tell（读写定位）',
    script: 'set f [open /demo/seek.txt w]; puts $f "0123456789"; close $f; set g [open /demo/seek.txt r]; seek $g 4; set t [tell $g]; set c [read $g 2]; close $g; list $t $c',
    want: '4 45' },
  { name: 'O12 append 模式',
    script: 'set f [open /demo/hello.txt a]; puts $f "more"; close $f; file size /demo/hello.txt',
    want: '16' },
  // ── regexp/regsub 外置（JS 同面；wasm 无 regexp-lite）──────────
  { name: 'R1 regexp 基本匹配',
    script: 'regexp a+b xaabbaac',
    want: '1' },
  { name: 'R2 捕获组写变量',
    script: 'regexp (a+)(b+) xaabbaac mv sv1 sv2; list $mv $sv1 $sv2',
    want: 'aabb aa bb' },
  { name: 'R3 -indices 首末对（relay 渲染层多一层引用）',
    script: 'regexp -indices (a+)(b+) xaabbaac iv iv1 iv2; list $iv $iv1 $iv2',
    want: '{1 4} {1 2} {3 4}' },
  { name: 'R4 -inline',
    script: 'regexp -inline (a+)(b+) xaabbaac',
    want: 'aabb aa bb' },
  { name: 'R5 -all 计数',
    script: 'regexp -all a banana',
    want: '3' },
  { name: 'S1 regsub -all',
    script: 'regsub -all a banana @ sub; set sub',
    want: 'b@n@n@' },
  { name: 'S2 regsub 捕获引用',
    script: 'regsub (a+)(b+) xaab {\\1-\\2-&} sv; set sv',
    want: 'xaa-b-aab' },
  { name: 'R6 POSIX 类',
    script: 'regexp {[[:alpha:]]+} abc123',
    want: '1' },
  { name: 'R7 -nocase',
    script: 'regexp -nocase ABC abc',
    want: '1' },
  { name: 'R8 -start 偏移',
    script: 'regexp -start 2 a xaxa',
    want: '1' },
  // ── Spencer 全集侧模块（native 同源引擎；JS 子集做不到的）──────
  { name: 'SP1 回引 (a+)\\1',
    script: 'regexp {(a+)\\1} aa',
    want: '1' },
  { name: 'SP2 前瞻 a(?=b)',
    script: 'regexp {a(?=b)} ab',
    want: '1' },
  { name: 'SP3 后顾 (?<=a)b（native 同报错，引擎对齐）',
    script: 'catch {regexp {(?<=a)b} ab} e; string match {*quantifier operand invalid*} $e',
    want: '1' },
  { name: 'SP4 -expanded（空白/注释忽略，JS 子集缺）',
    script: 'regexp -expanded {a b\n c} abc',
    want: '1' },
  { name: 'SP5 非 BMP 字符索引（native char 约定）',
    script: 'regexp -indices {\\U0001F201} x🈁y iv5; set iv5',
    want: '1 1' },
  { name: 'SP6 -all -inline 平铺',
    script: 'regexp -all -inline {\\d+} a1b22c333',
    want: '1 22 333' },
  { name: 'SP7 regsub 捕获换位',
    script: 'regsub {(a)(b)} ab {\\2\\1} v; set v',
    want: 'ba' },
  { name: 'SP8 -line 行锚 ^$',
    script: 'regexp -line {^b$} {a\nb}',
    want: '1' },
  { name: 'SP9 -expanded -nocase 组合',
    script: 'regexp -expanded -nocase {HELLO   WORLD} helloworld',
    want: '1' },
  { name: 'SP10 编译错误如实传播',
    script: 'catch {regexp {a[} x} e; string match {*compile regular expression*} $e',
    want: '1' },
  { name: 'SP11 -about native 全形（numGroups + re_info 位）',
    script: 'regexp -about {(a)b}',
    want: '1 {}' },
  { name: 'SP12 -all 变量取末匹配（native 同）',
    script: 'regexp -all (b) abcb v; set v',
    want: 'b' },
  // ── encoding 外置（JS TextDecoder 数据面）────────────────────
  { name: 'E1 encoding names 86 名宽表',
    script: 'llength [encoding names]',
    want: '86' },
  { name: 'E2 encoding system（utf-8 固定）',
    script: 'encoding system',
    want: 'utf-8' },
  { name: 'E3 convertto utf-8 → 字节串（UTF-8 双字节 = signed c）',
    script: 'binary scan [encoding convertto utf-8 {héllo}] c* b; set b',
    want: '104 -61 -87 108 108 111' },
  { name: 'E4 convertfrom utf-8 → 文本',
    script: 'encoding convertfrom utf-8 [encoding convertto utf-8 {héllo}]',
    want: 'héllo' },
  { name: 'E5 convertfrom iso8859-1（latin-1 字节直映）',
    script: 'encoding convertfrom iso8859-1 [format %c 233]',
    want: 'é' },
  { name: 'E6 convertfrom cp936（gb18030 双字节中文）',
    script: 'encoding convertfrom cp936 [format %c%c 196 227]',
    want: '你' },
  { name: 'E7 encoding dirs（空列表）',
    script: 'encoding dirs',
    want: '' },
];

const rows = document.getElementById('rows');
const log  = document.getElementById('log');
const banner = document.getElementById('banner');
let nPass = 0, nFail = 0;

function esc(s) {
  return String(s).replace(/[&<>]/g, (m) => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}
function rowEl(c) {
  const tr = document.createElement('tr');
  tr.innerHTML = `<td class="case"><div>${esc(c.name)}</div>` +
    `<div class="script">${esc(c.script)}</div>` +
    (c.want != null ? `<div class="want">期望: ${esc(String(c.want))}</div>` : '') +
    `</td><td class="res">…</td>`;
  rows.appendChild(tr);
  return tr.querySelector('.res');
}
function logln(s) { log.textContent += s + '\n'; log.scrollTop = log.scrollHeight; }
function mark(el, ok, got) {
  el.innerHTML = ok ? `<span class="pass">PASS</span>`
    : `<span class="fail">FAIL</span><div class="got">实际: ${esc(got)}</div>`;
  ok ? nPass++ : nFail++;
}

window.__send = send; function send(script) {
  return new Promise((resolve) => {
    const id = Math.random().toString(36).slice(2);
    const onMsg = (ev) => {
      if (ev.data.id !== id) return;
      worker.removeEventListener('message', onMsg);
      resolve(ev.data);
    };
    worker.addEventListener('message', onMsg);
    worker.postMessage({ id, script });
  });
}

worker.onmessage = async (ev) => {
  if (ev.data.type === 'ready') {
    document.getElementById('st-worker').textContent = 'ok';
    document.getElementById('st-fs').textContent = ev.data.fs;
    logln(`[worker] ready (fs=${ev.data.fs})`);
    // 持久化标记：上次运行留下的文件即证明 OPFS 落盘
    const marker = await send('catch {open /persist/marker.txt r} f; if {$f ne ""} { set s [read $f]; close $f; set s } else { set s "" }; set s');
    const prev = marker.ok ? marker.result.trim() : '';
    const strictPrev = await send('catch {open /persist/strict.txt r} f; if {$f ne ""} { set s [read $f]; close $f; set s } else { set s "" }; set s');
    const strictTxt = strictPrev.ok ? strictPrev.result.trim() : '';
    const stamp = Date.now();
    await send('file mkdir /persist; set f [open /persist/marker.txt w]; puts $f "' + stamp + '"; close $f');
    let persistNote = prev
      ? `🔁 持久化实证：读到上次运行写入的标记（时间戳 ${prev}）——OPFS 落盘生效`
      : '首次运行：/persist/marker.txt 已写入，刷新本页应显示上次的时间戳';
    if (strictTxt) persistNote += ` | ✅ 严格 durable 实证：上次运行被立即终止后写入的 strict 标记仍在（${strictTxt}）`;
    document.getElementById('persist').textContent = persistNote;
    await send('file delete -force /demo');   // 清场：保证可重复运行
    await send('catch {file delete /__rtcl_meta.json} e1; catch {file delete /__rtcl_meta.json.crswap} e2; catch {file delete -force /demo} e3');  // 残留 sidecar/swap 清理
    await run();
    // ── 严格 durable 实证：写 marker 后**立刻 terminate worker**——
    // write-behind 形态下微任务未跑数据即丢；SAB 桥形态下 write 返回
    // 时 OPFS 已落盘，数据必存。600ms 后自动重载验证。
    const strict = await send('file mkdir /persist; set f [open /persist/strict.txt w]; puts $f "strict-' + Date.now() + '"; close $f; set ok [file exists /persist/strict.txt]; list $ok');
    if (strict.ok && strict.result === '1 1') {
      logln('[strict] marker written; terminating worker NOW');
      worker.terminate();
      document.getElementById('persist').textContent = '⏳ 严格 durable 实证：worker 已被立即终止，600ms 后重载验证 /persist/strict.txt…';
      setTimeout(() => location.reload(), 600);
    }
  }
};

async function run() {
  for (const c of CASES) {
    const el = rowEl(c);
    logln(`— ${c.name}`);
    const r = await send(c.script);
    if (r.ok) {
      const ok = String(r.result) === String(c.want);
      mark(el, ok, r.result);
      logln(`  → ${ok ? 'PASS' : 'FAIL got: ' + r.result}`);
    } else {
      mark(el, false, r.error);
      logln(`  → 异常: ${r.error}`);
    }
  }
  const summary = document.getElementById('st-summary');
  summary.textContent = `${nPass} pass / ${nFail} fail`;
  banner.className = nFail === 0 ? 'ok' : 'bad';
  banner.textContent = nFail === 0
    ? '✅ 全部通过 — OPFS worker 形态文件 io 全链路可用'
    : `❌ ${nFail} 例失败（见表格）`;
}

worker.onerror = (e) => {
  banner.className = 'bad';
  banner.textContent = 'worker 异常：' + (e.message || e);
};
worker.addEventListener('message', (ev) => {
  if (ev.data.type === 'boot') logln('[worker boot] ' + (ev.data.stage || 'script loaded'));
  if (ev.data.type === 'init-error') {
    banner.className = 'bad';
    banner.textContent = 'worker init 异常：' + ev.data.error;
    logln('[worker init-error] ' + ev.data.error);
  }
  if (ev.data.type === 'fs') logln('[worker] fs mode: ' + ev.data.fs);
});
</script>
</body>
</html>
