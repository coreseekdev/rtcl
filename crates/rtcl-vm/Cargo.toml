[package]
name = "rtcl-vm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "rtcl VM — Value/Error/VmContext runtime core plus the interpreter (tree-walk + bytecode executor)"
keywords = ["tcl", "vm", "bytecode", "interpreter", "embedded"]
categories = ["parser-implementations"]

# D-24：clock 本地时区（libc localtime_r——/etc/localtime + TZ/DST
# 全部由 C 库承担）。仅 unix 目标、且只在 clock feature 打开时引入；
# wasm 走纯 UTC 路径。
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[dependencies]
rtcl-ir.workspace = true
rtcl-parser.workspace = true
rtcl-unicode.workspace = true
smallvec.workspace = true
indexmap.workspace = true

num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true

[dependencies.regex]
workspace = true
optional = true

[dependencies.regex-lite]
workspace = true
optional = true

[dependencies.rtcl-regexp-spencer]
workspace = true
optional = true

[dependencies.spin]
workspace = true
optional = true

[features]
default = ["rtcl_std", "iconv"]
# OS-level platform features (time, hostname, channels, filesystem)
std = []
# Tcl standard library — all extensions combined
rtcl_std = ["file", "io", "exec", "clock", "regexp", "regexp-spencer", "env", "signal", "package", "net", "load-cmd", "dynmod", "json", "encoding"]
# Individual Tcl extensions (each implies Rust std)
file = ["std"]                    # file, cd, pwd, glob (自实现), readdir, source
io = ["std"]                      # channel I/O: open, close, read, gets, seek, tell, eof, flush, fconfigure, pid
exec = ["std"]                    # exec, wait
clock = ["std", "dep:libc"]       # clock seconds/clicks/format/scan (+ unix 本地时区)
regexp = ["std", "dep:regex"]     # regexp, regsub
regexp-lite = ["std", "dep:regex-lite"]  # regexp, regsub (smaller WASM binary)
env = ["std"]                     # $env array from OS environment
net = ["std", "io"]               # socket (TCP client) — native only; wasm
                                  # has no sockets (可选特性：wasm 构建不含)
load-cmd = ["std"]                # load/unload — dynamic loading is
                                  # meaningless on wasm (可选特性)
encoding = ["file"]               # `encoding` 命令面（convertfrom/convertto/
                                  # names/system/dirs）。通道机制（encoding.rs
                                  # 系统编码/翻译）不受影响——仅命令面外置：
                                  # wasm 经 dynmod 注入 JS TextDecoder 实现
json = ["std"]                    # json decode/encode（1102 行 Rust 面）——
                                  # 可外置：网页宿主经 dynmod 注入 JS 实现
                                  #（JSON.parse/stringify + 值翻译），见
                                  # dynmod-test.html 的 jsonmod 区段
dynmod = []                       # load/unload 的动态模块注册表形态：
                                  # 宿主预实例化的 wasm/原生模块经
                                  # register_dyn_module 登记，load 挂线
                                  # （网页 dispatcher 的扩展面；wasm 默认含）
package = ["file"]                # package provide/require/names/forget
signal = ["std"]                  # kill, sleep
# Henry Spencer 正则引擎的 Rust 移植（B 路径；specs/regex-spencer-port.md）。
# 已并入 rtcl_std 默认开启；RTCL_REGEX_ENGINE=fast 可退回旧引擎。
regexp-spencer = ["dep:rtcl-regexp-spencer"]
# 外部 libc iconv 后端（encoding module 的宽表编码转换）。默认开；wasm /
# 无 libc 目标或显式 --no-default-features 时关闭，编码走字节直映兜底
# （名字表仍完整，convertfrom/to 对非内建编码退化为逐字节/UTF-8 直传）。
# 编码 backend 仅在 cfg(all(unix, feature = "iconv")) 下编译。
iconv = []
# For embedded/no-std targets
alloc = []
embedded = ["alloc", "dep:spin"]
# Enable extra diagnostics
debug = []

[[example]]
name = "spencer_span"
required-features = ["regexp-spencer"]

[[example]]
name = "spencer_bench"
required-features = ["regexp-spencer"]

[[example]]
name = "spencer_captures"
required-features = ["regexp-spencer"]
