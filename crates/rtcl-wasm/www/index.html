<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>rtcl web REPL</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: "SF Mono", Consolas, "Liberation Mono", Menlo, monospace;
    background: #0d1117; color: #c9d1d9;
    display: flex; flex-direction: column;
  }
  header {
    padding: 8px 16px; background: #161b22; border-bottom: 1px solid #30363d;
    font-size: 13px; color: #8b949e; display: flex; align-items: center; gap: 10px;
  }
  header b { color: #7ee787; font-weight: normal; }
  #status { margin-left: auto; font-size: 12px; }
  #status.ok { color: #3fb950; }
  #status.err { color: #f85149; }
  #term {
    flex: 1; overflow-y: auto; padding: 12px 16px; cursor: text;
    line-height: 1.5; font-size: 13px;
  }
  #term .line { white-space: pre-wrap; word-break: break-all; }
  #term .echo { color: #8b949e; }
  #term .echo .prompt { color: #1f6feb; }
  #term .cont { color: #a371f7; }
  #term .result { color: #7ee787; }
  #term .puts { color: #c9d1d9; }
  #term .error { color: #f85149; }
  #term .hint { color: #484f58; }
  .prompt { color: #1f6feb; user-select: none; }
  #active-line { display: flex; }
  #mirror { white-space: pre-wrap; word-break: break-all; }
  #caret {
    display: inline-block; width: 0.6em;
    border-bottom: 2px solid #7ee787; animation: blink 1.1s step-end infinite;
  }
  @keyframes blink { 50% { border-color: transparent; } }
  #kbd {
    position: absolute; left: -9999px; width: 10px; opacity: 0;
  }
</style>
</head>
<body>
<header>
  <b>rtcl</b> web REPL — Tcl in your browser
  <span id="status">loading WASM…</span>
</header>
<div id="term">
  <div id="out"></div>
  <div id="active-line" style="display:none">
    <span class="prompt" id="ps">%</span>&nbsp;<span id="mirror"></span>
  </div>
  <input id="kbd" autocomplete="off" autocapitalize="off" spellcheck="false">
</div>
<script type="module">
import init, { RtclHandle } from '../pkg/rtcl_wasm.js';

const out = document.getElementById('out');
const term = document.getElementById('term');
const kbd = document.getElementById('kbd');
const mirror = document.getElementById('mirror');
const ps = document.getElementById('ps');
const status = document.getElementById('status');
const activeLine = document.getElementById('active-line');

let rtcl = null;
let buf = '';            // current input line
let pending = '';        // accumulated lines of an incomplete command
let history = [];        // submitted commands, newest last
let histIdx = -1;

function print(text, cls) {
  const div = document.createElement('div');
  div.className = 'line' + (cls ? ' ' + cls : '');
  div.textContent = text;
  out.appendChild(div);
  term.scrollTop = term.scrollHeight;
}

// ── Tcl reader: is the script complete? (brace/bracket/quote balance) ──
// Models the Tcl reader: braces are strong quotes (backslash is literal
// inside them), backslash escapes apply outside braces, brackets track
// command substitution depth.
function isComplete(script) {
  let brace = 0, bracket = 0, inQuote = false;
  for (let i = 0; i < script.length; i++) {
    const c = script[i];
    if (brace === 0 && c === '\\') { i++; continue; }  // escape (incl. inside quotes)
    if (inQuote) { if (c === '"') inQuote = false; continue; }
    if (brace > 0) {
      if (c === '{') brace++;
      else if (c === '}') brace--;
      continue;                                        // brackets/quotes are literal in braces
    }
    if (c === '{') brace = 1;
    else if (c === '"') inQuote = true;
    else if (c === '[') bracket++;
    else if (c === ']') bracket--;
  }
  return brace === 0 && !inQuote && bracket <= 0;
}

// ── Line editor: mirror the hidden input's value + caret ──
function render() {
  const pos = kbd.selectionStart ?? buf.length;
  const before = buf.slice(0, pos);
  const at = buf.slice(pos, pos + 1) || ' ';
  const after = buf.slice(pos + 1);
  mirror.textContent = '';
  mirror.append(before);
  const caret = document.createElement('span');
  caret.id = 'caret';
  caret.textContent = at;
  mirror.append(caret);
  mirror.append(after);
}

function submit() {
  const line = buf;
  buf = '';
  kbd.value = '';
  print(ps.textContent + ' ' + line, 'echo');
  if (line.trim()) {
    if (history[history.length - 1] !== line) history.push(line);
    if (history.length > 500) history.shift();
  }
  histIdx = -1;

  pending += (pending ? '\n' : '') + line;
  if (!isComplete(pending)) {
    ps.textContent = '>';
    render();
    return;
  }

  const script = pending;
  pending = '';
  ps.textContent = '%';
  if (script.trim()) run(script);
  render();
}

function run(script) {
  try {
    const result = rtcl.exec(script);
    if (result !== '') print(result, 'result');
  } catch (e) {
    print('error: ' + (e && e.message || e), 'error');
  }
}

function historyNav(dir) {
  if (history.length === 0) return;
  if (dir < 0) {
    if (histIdx === -1) histIdx = history.length - 1;
    else if (histIdx > 0) histIdx--;
  } else {
    if (histIdx === -1) return;
    histIdx++;
    if (histIdx >= history.length) { histIdx = -1; }
  }
  buf = histIdx === -1 ? '' : history[histIdx];
  kbd.value = buf;
  kbd.setSelectionRange(buf.length, buf.length);
  render();
}

kbd.addEventListener('input', () => { buf = kbd.value; render(); });
kbd.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); submit(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); historyNav(-1); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); historyNav(1); }
  else if (e.key === 'Tab') { e.preventDefault(); }
});
document.addEventListener('selectionchange', () => {
  if (document.activeElement === kbd) render();
});
term.addEventListener('click', () => kbd.focus());
kbd.addEventListener('paste', (e) => {
  const text = (e.clipboardData || window.clipboardData).getData('text');
  if (!text.includes('\n')) return;              // single line: default insert
  e.preventDefault();
  print('% ' + text.replace(/\n/g, '\n  '), 'echo');
  run(text.replace(/\n+$/, ''));
});

// ── Boot ──
async function main() {
  await init();
  rtcl = new RtclHandle();

  // puts → output pane (no `rename puts` hack — stdout channel is replaced)
  rtcl.set_output_handler((s) => print(s.replace(/\n$/, ''), 'puts'));

  // Demo: JS functions registered as Tcl commands
  rtcl.register_command('add', (a, b) => Number(a) + Number(b));
  rtcl.register_command('now', () => new Date().toLocaleTimeString());
  rtcl.register_command('ticket', () => 'TCK-' + Math.random().toString(36).slice(2, 8).toUpperCase());

  window.rtcl = rtcl;
  print('rtcl ' + (rtcl.exec('info patchlevel') || '') + ' — WASM ready.', 'result');
  print('JS-registered commands: add, now, ticket', 'hint');
  print('try:  % add 1 2   |   % now   |   % proc f {x} { expr {$x*$x} }; f 9', 'hint');
  print('open DevTools and run  rtcl.register_command("hi", () => "hello")', 'hint');
  print('');

  activeLine.style.display = 'flex';
  kbd.focus();
  render();
  status.textContent = 'ready';
  status.className = 'ok';
}

main().catch((e) => {
  status.textContent = 'error: ' + (e && e.message || e);
  status.className = 'err';
  print('failed to init WASM: ' + (e && e.message || e), 'error');
});
</script>
</body>
</html>
